# The isolated maintenance link has no route or DNS, so use the workstation
# relay while it is connected. That relay is configured from Fermilab's
# canonical ntp.fnal.gov pool. Direct Fermilab sources remain the fallback
# after the registered interface receives a route and DNS.
[Time]
NTP=192.168.191.90
FallbackNTP=ntp.fnal.gov nsntp1.fnal.gov nsntp2.fnal.gov nsntp3.fnal.gov nsntp4.fnal.gov nsntp5.fnal.gov
RootDistanceMaxSec=15
PollIntervalMinSec=32
PollIntervalMaxSec=2048
